# Publish only an explicitly reviewed public site; Council ledger files must never be uploaded.
name: Deploy public site to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-public-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated public site
        shell: bash
        run: |
          set -euo pipefail
          test -d site
          test -f site/index.html
          test ! -L site
          if [ -n "$(find site -type l -print -quit)" ]; then
            echo "::error::Public site must not contain symlinks"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload only approved site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

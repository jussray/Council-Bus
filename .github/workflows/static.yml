# Publish only an explicitly reviewed public site; Council ledger files must never be uploaded.
name: Deploy public site to Pages
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_public_site.py'
      - 'scripts/check_interactive_preview.py'
      - '.github/workflows/static.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-public-pages
  cancel-in-progress: false
jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated public page and anchors
        run: |
          python3 scripts/check_public_site.py
          python3 scripts/check_interactive_preview.py
  deploy:
    needs: check-site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated public site
        shell: bash
        run: |
          set -euo pipefail
          test -d site
          test -f site/index.html
          test -f site/preview.html
          test ! -L site
          if [ -n "$(find site -type l -print -quit)" ]; then
            echo "::error::Public site must not contain symlinks"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage only the two reviewed public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/council-public-site"
          cp -- site/index.html "$RUNNER_TEMP/council-public-site/index.html"
          cp -- site/preview.html "$RUNNER_TEMP/council-public-site/preview.html"
      - name: Upload only staged public pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/council-public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

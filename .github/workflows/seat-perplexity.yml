name: seat-perplexity
on:
  pull_request:
    paths: ["seats/perplexity/**", ".github/workflows/seat-perplexity.yml"]
  push:
    branches: [main]
    paths: ["seats/perplexity/**", ".github/workflows/seat-perplexity.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seats/perplexity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seats/perplexity/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

name: Council anonymous Access boundary
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/seat_adapter.py"
      - "tests/test_seat_adapter.py"
      - ".github/workflows/council-access-negative.yml"
  push:
    branches: [main]
    paths:
      - "scripts/seat_adapter.py"
      - "tests/test_seat_adapter.py"
      - ".github/workflows/council-access-negative.yml"

permissions:
  contents: read

jobs:
  anonymous-denial:
    name: Anonymous health must be blocked by Cloudflare Access
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live Worker without identity or API credentials
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 --max-redirs 0 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              'https://council-router.mcgill-raylene.workers.dev/health')"; then
            echo 'BLOCKED: Could not reach Council hostname; no Access assertion.'
            exit 1
          fi
          echo "Anonymous HTTP status: $status"
          case "$status" in
            301|302|303|307|308)
              if grep -Eiq '^location:[[:space:]]*https://[^[:space:]]+\.cloudflareaccess\.com/' "$headers" ||
                 grep -Eiq '^location:[[:space:]]*(https://[^[:space:]]+)?/cdn-cgi/access/' "$headers"; then
                echo 'PASS: Cloudflare Access login intercepted /health.'
                exit 0
              fi
              echo 'FAIL: Redirect is not attributed to Cloudflare Access.'
              exit 1
              ;;
            401|403)
              if grep -Eiq 'Cloudflare Access|Cloudflare Zero Trust' "$body"; then
                echo 'PASS: Cloudflare Access denial intercepted /health.'
                exit 0
              fi
              echo 'FAIL: Denial is not attributed to Cloudflare Access.'
              exit 1
              ;;
            *)
              echo 'FAIL: Anonymous health request did not show Access enforcement.'
              exit 1
              ;;
          esac
